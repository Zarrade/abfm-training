name: Translate videos

on:
  push:
    branches: [main]
    paths:
      - "data/videos.json"
      - "data/settings.json"
      - "scripts/translate.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Translate new or changed videos
        run: node scripts/translate.mjs
      - name: Save translations
        run: |
          if git diff --quiet -- data; then
            echo "Nothing to translate."
            exit 0
          fi
          git config user.name "training-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Auto-translate videos"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
